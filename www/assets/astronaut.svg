<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="100%" height="100%">
  <defs>
    <!-- Suit Main Gradient (Glossy Space White & Lavender) -->
    <linearGradient id="suitWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ede9ff" />
      <stop offset="85%" stop-color="#c4c0ff" />
      <stop offset="100%" stop-color="#8c88db" />
    </linearGradient>

    <!-- Suit Shading Gradient -->
    <linearGradient id="suitShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="60%" stop-color="#231c6c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#090041" stop-opacity="0.75" />
    </linearGradient>

    <!-- Lavender Accent Trim -->
    <linearGradient id="lavenderTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7c1ef" />
      <stop offset="50%" stop-color="#8c88db" />
      <stop offset="100%" stop-color="#413c8a" />
    </linearGradient>

    <!-- Coral / Gold Trim -->
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#fdcb6e" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>

    <!-- Helmet Visor Deep Space Reflection -->
    <radialGradient id="visorGalaxy" cx="42%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#74b9ff" />
      <stop offset="30%" stop-color="#c4c0ff" />
      <stop offset="65%" stop-color="#36326c" />
      <stop offset="90%" stop-color="#17114d" />
      <stop offset="100%" stop-color="#090041" />
    </radialGradient>

    <!-- Cyan Pulse LED -->
    <radialGradient id="cyanLed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#74b9ff" />
      <stop offset="100%" stop-color="#0984e3" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="astroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="bodyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="12" dy="24" stdDeviation="16" flood-color="#090041" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Main Astronaut Assembly Group with dynamic zero-g tilt -->
  <g filter="url(#bodyShadow)" transform="translate(10, 10)">

    <!-- BACKPACK / PLSS (Portable Life Support System) -->
    <!-- Backpack Main Body -->
    <rect x="250" y="140" width="230" height="340" rx="48" fill="url(#suitWhite)" />
    <rect x="250" y="140" width="230" height="340" rx="48" fill="url(#suitShadow)" />
    <!-- Backpack Top Thruster Module -->
    <rect x="275" y="115" width="180" height="50" rx="20" fill="url(#lavenderTrim)" />
    <circle cx="310" cy="140" r="14" fill="#090041" stroke="#74b9ff" stroke-width="3" />
    <circle cx="420" cy="140" r="14" fill="#090041" stroke="#74b9ff" stroke-width="3" />
    <!-- Backpack Lateral Antennas & Sensory Node -->
    <path d="M 460,160 L 510,120" stroke="#c4c0ff" stroke-width="5" stroke-linecap="round" />
    <circle cx="510" cy="120" r="8" fill="#74b9ff" filter="url(#astroGlow)" />
    <!-- Oxygen Tank Cylinders -->
    <rect x="390" y="175" width="70" height="260" rx="32" fill="#ede9ff" stroke="#8c88db" stroke-width="3" />
    <rect x="390" y="240" width="70" height="15" fill="url(#lavenderTrim)" />

    <!-- BACKPACK CORRUGATED AIR HOSE (Curves around suit) -->
    <path d="M 280,360 C 220,380 200,470 290,490" fill="none" stroke="#231c6c" stroke-width="26" stroke-linecap="round" />
    <path d="M 280,360 C 220,380 200,470 290,490" fill="none" stroke="#74b9ff" stroke-width="20" stroke-linecap="round" stroke-dasharray="6,8" />

    <!-- REAR LEFT LEG -->
    <g id="left-leg">
      <!-- Thigh -->
      <path d="M 200,450 C 140,510 110,600 135,660 L 210,640 C 200,580 220,510 260,460 Z" fill="url(#suitWhite)" />
      <path d="M 200,450 C 140,510 110,600 135,660 L 210,640 C 200,580 220,510 260,460 Z" fill="url(#suitShadow)" />
      <!-- Knee Joint Pad -->
      <ellipse cx="145" cy="625" rx="34" ry="24" fill="url(#lavenderTrim)" transform="rotate(-30 145 625)" />
      <!-- Shin / Calf -->
      <path d="M 135,650 L 95,740 L 160,760 L 195,660 Z" fill="url(#suitWhite)" />
      <path d="M 135,650 L 95,740 L 160,760 L 195,660 Z" fill="url(#suitShadow)" />
      <!-- Boot -->
      <path d="M 70,735 C 60,770 95,790 145,785 L 165,750 C 130,745 100,735 70,735 Z" fill="url(#lavenderTrim)" stroke="#231c6c" stroke-width="3" />
      <path d="M 80,780 L 145,780" stroke="#74b9ff" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- TORSO & SUIT BODY -->
    <path d="M 260,240 C 350,230 430,260 440,360 C 445,430 410,500 370,530 C 320,545 250,530 220,490 C 190,440 200,320 260,240 Z" fill="url(#suitWhite)" />
    <path d="M 260,240 C 350,230 430,260 440,360 C 445,430 410,500 370,530 C 320,545 250,530 220,490 C 190,440 200,320 260,240 Z" fill="url(#suitShadow)" />

    <!-- CHEST CONTROL PACK / TELEMETRY UNIT -->
    <rect x="255" y="320" width="135" height="115" rx="20" fill="#ffffff" stroke="#c4c0ff" stroke-width="3" filter="url(#bodyShadow)" />
    <!-- Mission Crest Badge -->
    <polygon points="275,340 315,340 315,370 295,385 275,370" fill="url(#lavenderTrim)" />
    <circle cx="295" cy="358" r="6" fill="#74b9ff" />
    <!-- Digital Gauges & Controls -->
    <rect x="330" y="340" width="45" height="18" rx="6" fill="#090041" />
    <line x1="335" y1="349" x2="368" y2="349" stroke="#74b9ff" stroke-width="2" />
    <!-- Status Indicator LEDs -->
    <circle cx="280" cy="410" r="6" fill="url(#cyanLed)" filter="url(#astroGlow)" />
    <circle cx="305" cy="410" r="6" fill="#ffb2b9" />
    <circle cx="330" cy="410" r="6" fill="#6bcb9f" />
    <circle cx="355" cy="410" r="6" fill="#74b9ff" />

    <!-- FORWARD RIGHT LEG -->
    <g id="right-leg">
      <!-- Thigh -->
      <path d="M 330,480 C 380,515 440,580 430,660 L 360,670 C 350,600 330,550 280,510 Z" fill="url(#suitWhite)" />
      <path d="M 330,480 C 380,515 440,580 430,660 L 360,670 C 350,600 330,550 280,510 Z" fill="url(#suitShadow)" />
      <!-- Knee Joint Pad -->
      <ellipse cx="400" cy="630" rx="36" ry="26" fill="url(#lavenderTrim)" transform="rotate(25 400 630)" />
      <!-- Shin -->
      <path d="M 385,655 L 420,750 L 360,775 L 340,675 Z" fill="url(#suitWhite)" />
      <path d="M 385,655 L 420,750 L 360,775 L 340,675 Z" fill="url(#suitShadow)" />
      <!-- Boot -->
      <path d="M 400,745 C 440,750 460,785 435,805 L 365,795 C 350,775 370,750 400,745 Z" fill="url(#lavenderTrim)" stroke="#231c6c" stroke-width="3" />
      <path d="M 375,795 L 430,800" stroke="#74b9ff" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- RIGHT EXTENDED ARM & GLOVE -->
    <g id="right-arm">
      <!-- Shoulder Bell -->
      <ellipse cx="430" cy="300" rx="42" ry="36" fill="url(#suitWhite)" stroke="#8c88db" stroke-width="2" />
      <!-- Bicep -->
      <path d="M 440,310 C 490,340 540,410 550,460 L 495,480 C 475,430 450,370 410,340 Z" fill="url(#suitWhite)" />
      <path d="M 440,310 C 490,340 540,410 550,460 L 495,480 C 475,430 450,370 410,340 Z" fill="url(#suitShadow)" />
      <!-- Arm Mission Patch (Flag / Orbit) -->
      <rect x="475" y="380" width="30" height="20" rx="4" fill="#231c6c" stroke="#ffb2b9" stroke-width="1.5" transform="rotate(40 475 380)" />
      <!-- Forearm -->
      <path d="M 525,455 L 575,540 L 530,560 L 485,480 Z" fill="url(#suitWhite)" />
      <path d="M 525,455 L 575,540 L 530,560 L 485,480 Z" fill="url(#suitShadow)" />
      <!-- Wrist Ring Seal -->
      <ellipse cx="550" cy="545" rx="26" ry="16" fill="url(#lavenderTrim)" transform="rotate(55 550 545)" />
      <!-- Glove Floating Palm Down -->
      <path d="M 545,555 C 570,570 600,615 580,635 C 560,645 540,610 525,595 L 515,570 Z" fill="url(#lavenderTrim)" />
      <circle cx="560" cy="600" r="4" fill="#74b9ff" />
    </g>

    <!-- LEFT WAVING ARM & GLOVE -->
    <g id="left-arm">
      <!-- Shoulder Bell -->
      <ellipse cx="205" cy="300" rx="38" ry="32" fill="url(#suitWhite)" stroke="#8c88db" stroke-width="2" />
      <!-- Arm curving upwards -->
      <path d="M 190,290 C 140,300 90,340 80,400 L 130,420 C 145,370 170,345 200,335 Z" fill="url(#suitWhite)" />
      <path d="M 190,290 C 140,300 90,340 80,400 L 130,420 C 145,370 170,345 200,335 Z" fill="url(#suitShadow)" />
      <!-- Forearm -->
      <path d="M 90,390 L 75,475 L 125,485 L 135,410 Z" fill="url(#suitWhite)" />
      <!-- Glove -->
      <ellipse cx="98" cy="485" rx="24" ry="15" fill="url(#lavenderTrim)" transform="rotate(-15 98 485)" />
      <path d="M 85,495 C 65,515 70,545 95,545 C 115,540 125,515 110,495 Z" fill="url(#lavenderTrim)" />
    </g>

    <!-- HELMET AND BUBBLE VISOR -->
    <g id="helmet-assembly">
      <!-- Helmet Outer Collar Ring -->
      <ellipse cx="320" cy="235" rx="115" ry="38" fill="url(#lavenderTrim)" stroke="#413c8a" stroke-width="3" />

      <!-- Helmet Spherical Dome Base -->
      <circle cx="320" cy="180" r="110" fill="url(#suitWhite)" />
      <circle cx="320" cy="180" r="110" fill="url(#suitShadow)" opacity="0.6" />

      <!-- Helmet Side Communication Ear Pods & Torch Lights -->
      <!-- Left Ear Pod -->
      <rect x="200" y="150" width="22" height="50" rx="10" fill="url(#lavenderTrim)" />
      <circle cx="211" cy="175" r="7" fill="#74b9ff" filter="url(#astroGlow)" />
      <!-- Right Ear Pod -->
      <rect x="418" y="150" width="22" height="50" rx="10" fill="url(#lavenderTrim)" />
      <circle cx="429" cy="175" r="7" fill="#74b9ff" filter="url(#astroGlow)" />

      <!-- Visor Metallic Gold Gasket Rim -->
      <ellipse cx="320" cy="175" rx="94" ry="78" fill="url(#goldTrim)" filter="url(#astroGlow)" />
      <ellipse cx="320" cy="175" rx="90" ry="74" fill="#090041" />

      <!-- Visor Reflective Cosmic Glass -->
      <ellipse cx="320" cy="175" rx="87" ry="71" fill="url(#visorGalaxy)" />

      <!-- Inside Visor: Galactic Nebula Cloud & Stars Reflection -->
      <!-- Nebula Arc -->
      <path d="M 260,185 Q 310,140 375,170 Q 340,210 280,205 Z" fill="#ffb2b9" opacity="0.45" filter="url(#astroGlow)" />
      <path d="M 280,165 Q 330,135 365,150 Q 350,180 300,180 Z" fill="#74b9ff" opacity="0.5" />
      <!-- Visor Stars -->
      <circle cx="270" cy="160" r="2.5" fill="#ffffff" />
      <circle cx="350" cy="155" r="3" fill="#ffffff" filter="url(#astroGlow)" />
      <circle cx="320" cy="205" r="2" fill="#c4c0ff" />
      <circle cx="375" cy="195" r="1.5" fill="#ffffff" />

      <!-- Visor Curved Glass Specular Highlight (Reflection of light source) -->
      <path d="M 255,145 C 280,120 335,115 365,125 C 335,123 285,130 265,155 Z" fill="#ffffff" opacity="0.85" filter="url(#astroGlow)" />
      <path d="M 250,160 C 245,175 250,195 260,205 C 253,195 250,175 255,160 Z" fill="#ffffff" opacity="0.5" />
    </g>

  </g>
</svg>
