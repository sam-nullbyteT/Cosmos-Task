<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4c0ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8c88db" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f0645" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Body Gradient -->
    <radialGradient id="planetGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#e4dfff" />
      <stop offset="25%" stop-color="#c4c0ff" />
      <stop offset="60%" stop-color="#5955a4" />
      <stop offset="85%" stop-color="#231c6c" />
      <stop offset="100%" stop-color="#090041" />
    </radialGradient>

    <!-- Ring Gradient Front -->
    <linearGradient id="ringFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#c4c0ff" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffb2b9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c7c1ef" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ring Gradient Back -->
    <linearGradient id="ringBack" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#231c6c" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#413c8a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Inner Shadow for Neumorphic feel -->
    <radialGradient id="planetHighlight" cx="30%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Mask to hide back of ring behind planet -->
    <mask id="planetMask">
      <rect width="512" height="512" fill="#ffffff" />
      <circle cx="256" cy="256" r="118" fill="#000000" />
    </mask>

    <clipPath id="frontClip">
      <!-- Only show front part of ring -->
      <path d="M 0,256 L 512,140 L 512,512 L 0,512 Z" />
    </clipPath>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)" />

  <!-- Back Ring (behind planet) -->
  <g mask="url(#planetMask)">
    <!-- Outer faint track -->
    <ellipse cx="256" cy="256" rx="200" ry="75" fill="none" stroke="#8c88db" stroke-width="2" stroke-dasharray="6,8" opacity="0.4" transform="rotate(-28 256 256)" />
    <!-- Main back ring -->
    <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#ringBack)" stroke-width="14" transform="rotate(-28 256 256)" filter="url(#neonGlow)" />
  </g>

  <!-- Planet Sphere Shadow -->
  <circle cx="256" cy="260" r="115" fill="#050024" opacity="0.6" filter="blur(10px)" />

  <!-- Central Planet Sphere -->
  <circle cx="256" cy="256" r="114" fill="url(#planetGrad)" />

  <!-- Planet Surface Detail / Subtle Craters / Atmospheric Bands -->
  <path d="M 160,230 Q 230,250 330,220 Q 360,250 340,280 Q 240,290 170,270 Z" fill="#8c88db" opacity="0.18" />
  <path d="M 175,290 Q 260,320 335,285 Q 320,330 250,345 Q 190,335 175,290 Z" fill="#231c6c" opacity="0.3" />

  <!-- Specular Light Highlight -->
  <circle cx="256" cy="256" r="114" fill="url(#planetHighlight)" />

  <!-- Planet Rim Glow -->
  <circle cx="256" cy="256" r="113" fill="none" stroke="#c4c0ff" stroke-width="2.5" opacity="0.65" />

  <!-- Front Ring (in front of planet) -->
  <g clip-path="url(#frontClip)">
    <!-- Core Bright Ring -->
    <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="url(#ringFront)" stroke-width="16" stroke-linecap="round" transform="rotate(-28 256 256)" filter="url(#neonGlow)" />
    <!-- Secondary Thin Orbit Line -->
    <ellipse cx="256" cy="256" rx="205" ry="68" fill="none" stroke="#74b9ff" stroke-width="3" opacity="0.8" transform="rotate(-28 256 256)" />
  </g>

  <!-- Orbital Satellite Nodes / Sparkles -->
  <!-- Node 1 on front ring -->
  <circle cx="395" cy="180" r="8" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="395" cy="180" r="4" fill="#74b9ff" />
  <!-- Node 2 small orbit sparkle -->
  <circle cx="105" cy="335" r="5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="105" cy="335" r="2.5" fill="#ffb2b9" />

  <!-- Cosmic Stars / Checkmark Star Constellation -->
  <!-- Big 4-point Star -->
  <path d="M 400,90 Q 400,110 420,110 Q 400,110 400,130 Q 400,110 380,110 Q 400,110 400,90 Z" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="400" cy="110" r="3" fill="#c4c0ff" />

  <!-- Small 4-point Star -->
  <path d="M 110,130 Q 110,142 122,142 Q 110,142 110,154 Q 110,142 98,142 Q 110,142 110,130 Z" fill="#c4c0ff" opacity="0.9" />

  <!-- Tiny Stars -->
  <circle cx="140" cy="90" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="340" cy="65" r="2.5" fill="#74b9ff" opacity="0.9" />
  <circle cx="430" cy="290" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="85" cy="240" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="280" cy="430" r="3" fill="#c4c0ff" opacity="0.8" />
  <circle cx="370" cy="390" r="1.5" fill="#ffffff" opacity="0.7" />
</svg>
